<!<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NavbatAI Staff — Xodim Akkounti va Ish Stoli</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="./staff-logo.png" />
  <link rel="apple-touch-icon" href="./staff-logo.png" />
  <link rel="manifest" href="./manifest-staff.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { background-color: #000000; color: #FFFFFF; font-family: 'Inter', sans-serif; }
    .oled-card { background-color: #151517; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; }
    .oled-card-2 { background-color: #1C1C1E; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; }
  </style>
</head>
<body class="min-h-screen bg-black text-white antialiased">
  <div class="max-w-[540px] mx-auto min-h-screen flex flex-col px-4 py-5 sm:border-x sm:border-white/[0.06]">

    <!-- Toast -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-[420px] w-[92%] pointer-events-none opacity-0 transition-all duration-300">
      <div class="bg-[#1C1C1E]/95 border border-white/15 px-4 py-3 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2.5">
        <span id="toastDot" class="w-2.5 h-2.5 rounded-full bg-[#22C55E]"></span>
        <span id="toastText"></span>
      </div>
    </div>

    <!-- Header -->
    <header class="flex items-center justify-between pb-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2.5">
        <img src="./staff-logo.png" alt="NavbatAI" class="w-9 h-9 rounded-xl object-cover border border-white/15" />
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-extrabold">NavbatAI Staff</h1>
            <span id="syncStatus" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#22C55E]/15 text-[#22C55E] border border-[#22C55E]/30">● Jonli</span>
          </div>
          <p id="headerStaffSub" class="text-[11px] text-[#8E8E93]">Xodimlar profili va navbat boshqaruvi</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="./index.html" class="px-3 py-1.5 rounded-xl bg-[#1C1C1E] hover:bg-[#2C2C2E] text-xs font-bold text-[#E2C2FF]">
          Xarita
        </a>
        <button id="logoutBtn" onclick="logoutStaff()" class="hidden px-3 py-1.5 rounded-xl bg-[#1C1C1E] hover:bg-[#2C2C2E] text-xs font-bold text-[#F87171] cursor-pointer">
          Chiqish
        </button>
      </div>
    </header>

    <!-- STEP 1: STAFF ACCOUNT (LOGIN / REGISTER) -->
    <section id="staffAuthSection" class="py-5 space-y-4">
      <div class="oled-card p-5 space-y-4 shadow-2xl">
        <div class="grid grid-cols-2 gap-1.5 bg-black p-1 rounded-2xl border border-white/[0.08]">
          <button type="button" id="tabStaffLogin" onclick="setAuthTab('login')"
            class="py-2.5 rounded-xl text-xs font-extrabold bg-[#E2C2FF] text-[#111114] cursor-pointer">
            Kirish
          </button>
          <button type="button" id="tabStaffRegister" onclick="setAuthTab('register')"
            class="py-2.5 rounded-xl text-xs font-bold text-[#8E8E93] hover:text-white cursor-pointer">
            Akkount yaratish
          </button>
        </div>

        <div id="regExtraFields" class="hidden space-y-3">
          <div>
            <label class="block text-xs text-[#8E8E93] mb-1">Xodim ism-familiyasi (shifokor / mutaxassis) *</label>
            <input id="regFullName" type="text" placeholder="Masalan: Dr. Dilshod Rahimov"
              class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3.5 py-3 text-xs font-semibold text-white" />
          </div>

          <div>
            <label class="block text-xs text-[#8E8E93] mb-1">Qaysi sohada ishlaysiz? *</label>
            <select id="regField" onchange="onRegFieldChange()" class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3.5 py-3 text-xs font-semibold text-white">
              <option value="shifoxona" class="bg-[#1C1C1E]">🏥 Shifoxona (Tibbiyot)</option>
              <option value="bank" class="bg-[#1C1C1E]">🏦 Bank</option>
              <option value="dxm" class="bg-[#1C1C1E]">🏛 DXM (Davlat xizmatlari)</option>
              <option value="ayoqsh" class="bg-[#1C1C1E]">⛽ AYOQSH</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs text-[#8E8E93] mb-1">Viloyat *</label>
              <select id="regRegion" onchange="onRegLocationChange()" class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3 py-3 text-xs font-semibold text-white"></select>
            </div>
            <div>
              <label class="block text-xs text-[#8E8E93] mb-1">Tuman / Shahar / Manzil *</label>
              <input id="regDistrictAddress" type="text" oninput="renderFacilitySearchResults()" placeholder="Masalan: Jizzax shahar, Ittifoq"
                class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3 py-3 text-xs font-semibold text-white" />
            </div>
          </div>

          <!-- Xaritadagi muassasalar orasidan izlash -->
          <div class="oled-card-2 p-3.5 space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-[#E2C2FF]">📍 Ish joyini xaritadagi muassasalar orasidan izlang</label>
              <span id="facMatchCount" class="text-[10px] text-[#8E8E93]">0 ta</span>
            </div>
            <input id="facSearchInput" type="text" oninput="renderFacilitySearchResults()"
              placeholder="Muassasa nomi yoki ko‘cha bo‘yicha izlash..."
              class="w-full bg-black border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white" />

            <div id="facSearchResults" class="max-h-40 overflow-y-auto space-y-1.5"></div>

            <!-- Agar muassasa ro'yxatda bo'lmasa manzil bo'yicha shu tuman/shahardagi muassasalar -->
            <div id="districtFallbackBox" class="hidden pt-2 border-t border-white/10 space-y-2">
              <div class="text-[11px] text-[#F59E0B] font-semibold">
                Ko‘rsatilgan tuman/shahar yoki manzil bo‘yicha muassasalar:
              </div>
              <div id="districtFacilitiesList" class="space-y-1.5 max-h-32 overflow-y-auto"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label id="deptLabel" class="block text-xs text-[#8E8E93] mb-1">Bo‘lim / Yo‘nalish *</label>
              <select id="regDept" class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3 py-3 text-xs font-semibold text-white"></select>
            </div>
            <div>
              <label id="roomLabel" class="block text-xs text-[#8E8E93] mb-1">Ish xonasi / Oyna *</label>
              <input id="regRoom" type="text" placeholder="Masalan: 104-xona"
                class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3 py-3 text-xs font-semibold text-white" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs text-[#8E8E93] mb-1">Telefon raqam yoki xodim logini *</label>
          <input id="authPhoneOrLogin" type="text" value="+998 " placeholder="+998 90 123 45 67"
            class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3.5 py-3 text-xs font-semibold text-white" />
        </div>

        <div>
          <label class="block text-xs text-[#8E8E93] mb-1">Parol *</label>
          <input id="authPassword" type="password" placeholder="Kamida 4 ta belgi"
            class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl px-3.5 py-3 text-xs font-semibold text-white" />
        </div>

        <button id="authSubmitBtn" onclick="submitStaffAuth()"
          class="w-full py-3.5 rounded-2xl bg-[#E2C2FF] hover:bg-[#D8B4FE] text-[#111114] font-extrabold text-sm cursor-pointer transition">
          Kirish
        </button>
      </div>
    </section>

    <!-- STEP 2: STAFF WORKSTATION -->
    <section id="staffWorkSection" class="hidden flex-1 py-4 space-y-4">
      <div class="oled-card p-4 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div id="workFacilityName" class="text-[11px] font-bold text-[#E2C2FF] truncate">Muassasa</div>
          <h2 id="workStaffName" class="text-base font-extrabold text-white truncate">Xodim</h2>
          <div id="workMeta" class="text-xs text-[#8E8E93] mt-0.5">Soha • Bo‘lim • Xona</div>
        </div>
        <div class="text-right shrink-0 bg-[#1C1C1E] px-3 py-2 rounded-2xl border border-white/10">
          <div class="text-[10px] text-[#8E8E93]">Navbatda</div>
          <div id="workQueueCount" class="text-xl font-extrabold text-[#22C55E]">0</div>
        </div>
      </div>

      <div id="currentServingBox" class="oled-card p-5 space-y-3 border border-[#E2C2FF]/35"></div>

      <div class="oled-card p-3.5 flex items-center gap-2">
        <input id="walkInName" type="text" placeholder="Joyida kelgan mijoz ismi (ixtiyoriy)..."
          class="flex-1 bg-[#1C1C1E] border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white" />
        <button onclick="addWalkInPatient()" class="px-3.5 py-2.5 rounded-xl bg-[#22C55E] text-[#111114] font-extrabold text-xs shrink-0 cursor-pointer">
          + Qo‘shish
        </button>
      </div>

      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-[#8E8E93]">Kutayotganlar ro‘yxati</h3>
          <button onclick="pullFromFirebase(true)" class="text-xs font-bold text-[#E2C2FF] cursor-pointer">↻ Yangilash</button>
        </div>
        <div id="waitingQueueList" class="space-y-2"></div>
      </div>
    </section>

  </div>

  <script>
    const FIREBASE_URL = "https://navbatai-3im-default-rtdb.europe-west1.firebasedatabase.app";
    const STAFF_ACCOUNTS_KEY = "navbat_staff_accounts_v1";
    const STAFF_SESSION_KEY = "navbat_staff_active_v1";

    const REGIONS = {
      jizzax: "Jizzax", toshkent: "Toshkent", samarqand: "Samarqand", buxoro: "Buxoro",
      andijon: "Andijon", fargona: "Farg‘ona", namangan: "Namangan", qashqadaryo: "Qashqadaryo",
      surxondaryo: "Surxondaryo", navoiy: "Navoiy", sirdaryo: "Sirdaryo", xorazm: "Xorazm", qoraqalpogiston: "Qoraqalpog‘iston"
    };

    const DEPTS_BY_FIELD = {
      shifoxona: [
        { id: "terapevt", name: "Terapevt" },
        { id: "stomatolog", name: "Stomatolog (Tish)" },
        { id: "ginekolog", name: "Ginekolog" },
        { id: "oftalmolog", name: "Oftalmolog (Ko‘z)" },
        { id: "kardiolog", name: "Kardiolog (Yurak)" },
        { id: "pediatr", name: "Pediatr (Bolalar)" },
        { id: "lor", name: "LOR" }
      ],
      bank: [
        { id: "karta", name: "Karta ochish va omonatlar" },
        { id: "kredit", name: "Kredit bo‘limi" }
      ],
      dxm: [
        { id: "id_pasport", name: "ID-karta / Pasport" },
        { id: "kadastr", name: "Kadastr va ko‘chmas mulk" }
      ],
      ayoqsh: [
        { id: "metan", name: "Metan" },
        { id: "propan", name: "Propan" },
        { id: "benzin", name: "Benzin" },
        { id: "dizel", name: "Dizel" },
        { id: "elektr", name: "Elektr" }
      ]
    };

    let FACILITIES = [];
    let GLOBAL_QUEUES = {};
    let STAFF_ACCOUNTS = {};
    let authTab = "login";
    let selectedFacilityObj = null;
    let activeStaff = null;

    function showToast(msg, warn = false) {
      const el = document.getElementById("toast");
      document.getElementById("toastText").textContent = msg;
      document.getElementById("toastDot").className = `w-2.5 h-2.5 rounded-full ${warn ? 'bg-[#F59E0B]' : 'bg-[#22C55E]'}`;
      el.classList.remove("opacity-0");
      setTimeout(() => el.classList.add("opacity-0"), 2800);
    }

    function loadLocalAccounts() {
      try { STAFF_ACCOUNTS = JSON.parse(localStorage.getItem(STAFF_ACCOUNTS_KEY) || "{}"); } catch { STAFF_ACCOUNTS = {}; }
    }
    function saveLocalAccounts() {
      try { localStorage.setItem(STAFF_ACCOUNTS_KEY, JSON.stringify(STAFF_ACCOUNTS)); } catch {}
    }

    async function pullFromFirebase(manual = false) {
      try {
        const res = await fetch(`${FIREBASE_URL}/navbatai_state.json`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data) {
          if (Array.isArray(data.facilities)) FACILITIES = data.facilities;
          GLOBAL_QUEUES = data.queues || {};
          if (data.staffAccounts && typeof data.staffAccounts === "object") {
            STAFF_ACCOUNTS = { ...data.staffAccounts, ...STAFF_ACCOUNTS };
            saveLocalAccounts();
          }
        }
        document.getElementById("syncStatus").textContent = "● Jonli";
        if (activeStaff) renderWorkstation();
        else renderFacilitySearchResults();
        if (manual) showToast("Ma’lumotlar yangilandi");
      } catch {
        document.getElementById("syncStatus").textContent = "● Lokal";
        if (manual) showToast("Firebase bilan ulanish tekshirilmoqda", true);
      }
    }

    async function pushStateToFirebase() {
      try {
        await fetch(`${FIREBASE_URL}/navbatai_state.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            facilities: FACILITIES,
            queues: GLOBAL_QUEUES,
            staffAccounts: STAFF_ACCOUNTS
          })
        });
      } catch {}
    }

    function setAuthTab(tab) {
      authTab = tab;
      const isReg = tab === "register";
      document.getElementById("tabStaffLogin").className = !isReg
        ? "py-2.5 rounded-xl text-xs font-extrabold bg-[#E2C2FF] text-[#111114] cursor-pointer"
        : "py-2.5 rounded-xl text-xs font-bold text-[#8E8E93] hover:text-white cursor-pointer";
      document.getElementById("tabStaffRegister").className = isReg
        ? "py-2.5 rounded-xl text-xs font-extrabold bg-[#E2C2FF] text-[#111114] cursor-pointer"
        : "py-2.5 rounded-xl text-xs font-bold text-[#8E8E93] hover:text-white cursor-pointer";
      document.getElementById("regExtraFields").classList.toggle("hidden", !isReg);
      document.getElementById("authSubmitBtn").textContent = isReg
        ? "Akkount yaratish va ishni boshlash"
        : "Kirish";
      if (isReg) {
        onRegFieldChange();
        renderFacilitySearchResults();
      }
    }

    function onRegFieldChange() {
      const field = document.getElementById("regField").value;
      const depts = DEPTS_BY_FIELD[field] || DEPTS_BY_FIELD.shifoxona;
      document.getElementById("regDept").innerHTML = depts.map(d => `<option value="${d.id}" class="bg-[#1C1C1E]">${d.name}</option>`).join("");
      document.getElementById("roomLabel").textContent = field === "ayoqsh" ? "Kolonka / Yo‘lak *" : (field === "shifoxona" ? "Ish xonasi *" : "Oyna raqami *");
      document.getElementById("regRoom").placeholder = field === "ayoqsh" ? "Masalan: 1-kolonka" : (field === "shifoxona" ? "Masalan: 104-xona" : "Masalan: 2-oyna");
      renderFacilitySearchResults();
    }

    function onRegLocationChange() {
      selectedFacilityObj = null;
      renderFacilitySearchResults();
    }

    function pickFacility(facId) {
      const found = FACILITIES.find(f => f.id === facId);
      if (!found) return;
      selectedFacilityObj = found;
      renderFacilitySearchResults();
      showToast(`Tanlandi: ${found.name}`);
    }

    function renderFacilitySearchResults() {
      const reg = document.getElementById("regRegion").value || "jizzax";
      const field = document.getElementById("regField").value || "shifoxona";
      const q = (document.getElementById("facSearchInput").value || "").toLowerCase().trim();
      const districtAddr = (document.getElementById("regDistrictAddress").value || "").toLowerCase().trim();

      // 1) Xaritadagi muassasalar orasidan izlash
      const byFieldAndRegion = FACILITIES.filter(f => f.region === reg && f.type === field);
      const matched = byFieldAndRegion.filter(f => {
        if (!q && !districtAddr) return true;
        const hay = `${f.name} ${f.address}`.toLowerCase();
        const okQ = !q || hay.includes(q);
        const okD = !districtAddr || hay.includes(districtAddr);
        return okQ && okD;
      });

      document.getElementById("facMatchCount").textContent = `${matched.length} ta`;
      const resBox = document.getElementById("facSearchResults");

      if (matched.length === 0) {
        resBox.innerHTML = `<div class="p-3 rounded-xl bg-black/70 text-[11px] text-[#8E8E93]">Xaritadagi mos muassasa topilmadi. Pastdagi tuman/shahar ro‘yxatidan tanlang yoki manzilni aniqlashtiring.</div>`;
      } else {
        resBox.innerHTML = matched.slice(0, 12).map(f => {
          const active = selectedFacilityObj && selectedFacilityObj.id === f.id;
          return `
            <button type="button" onclick="pickFacility('${f.id}')"
              class="w-full text-left p-2.5 rounded-xl border cursor-pointer transition ${active ? 'bg-[#E2C2FF]/20 border-[#E2C2FF]' : 'bg-black/70 border-white/10 hover:border-white/25'}">
              <div class="text-xs font-bold text-white truncate">${active ? '✓ ' : ''}${f.name}</div>
              <div class="text-[10px] text-[#8E8E93] truncate">${f.address}</div>
            </button>`;
        }).join("");
      }

      // 2) Shu viloyat / tuman / shahar bo'yicha barcha muassasalar
      const fallbackBox = document.getElementById("districtFallbackBox");
      const fallbackList = document.getElementById("districtFacilitiesList");
      const regionalAll = FACILITIES.filter(f => f.region === reg && (!districtAddr || `${f.name} ${f.address}`.toLowerCase().includes(districtAddr)));

      if (matched.length === 0 || districtAddr) {
        fallbackBox.classList.remove("hidden");
        fallbackList.innerHTML = regionalAll.length === 0
          ? `<div class="text-[11px] text-[#8E8E93]">Bu manzil bo‘yicha yozuv topilmadi — kiritilgan manzil bilan yangi ish joyi biriktiriladi.</div>`
          : regionalAll.slice(0, 8).map(f => {
              const active = selectedFacilityObj && selectedFacilityObj.id === f.id;
              return `
                <button type="button" onclick="pickFacility('${f.id}')"
                  class="w-full text-left p-2 rounded-xl border cursor-pointer ${active ? 'bg-[#22C55E]/15 border-[#22C55E]' : 'bg-black/60 border-white/10'}">
                  <div class="text-[11px] font-bold text-white truncate">${f.name} <span class="text-[#8E8E93] font-normal">(${f.type})</span></div>
                  <div class="text-[10px] text-[#8E8E93] truncate">${f.address}</div>
                </button>`;
            }).join("");
      } else {
        fallbackBox.classList.add("hidden");
      }
    }

    function makeStaffSlugId(name) {
      return "staff-" + (name || "xodim").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    async function submitStaffAuth() {
      const loginKey = document.getElementById("authPhoneOrLogin").value.replace(/\s+/g, "").trim();
      const password = document.getElementById("authPassword").value.trim();
      if (!loginKey || password.length < 4) {
        return showToast("Telefon/login va parolni (kamida 4 belgi) kiriting!", true);
      }

      if (authTab === "login") {
        const acc = STAFF_ACCOUNTS[loginKey];
        if (!acc || acc.password !== password) {
          return showToast("Akkount topilmadi yoki parol noto‘g‘ri!", true);
        }
        activeStaff = acc;
        localStorage.setItem(STAFF_SESSION_KEY, JSON.stringify(activeStaff));
        openWorkstationUI();
        showToast(`Xush kelibsiz, ${activeStaff.fullName}!`);
        return;
      }

      // Register new staff account
      const fullName = document.getElementById("regFullName").value.trim();
      const field = document.getElementById("regField").value;
      const region = document.getElementById("regRegion").value;
      const districtAddress = document.getElementById("regDistrictAddress").value.trim();
      const deptId = document.getElementById("regDept").value;
      const deptObj = (DEPTS_BY_FIELD[field] || []).find(d => d.id === deptId) || { id: deptId, name: deptId };
      const room = document.getElementById("regRoom").value.trim() || "1-xona";

      if (!fullName) return showToast("Xodim ism-familiyasini kiriting!", true);

      let facilityObj = selectedFacilityObj;
      if (!facilityObj) {
        if (!districtAddress) {
          return showToast("Xaritadan muassasa tanlang yoki ish joyining manzilini kiriting!", true);
        }
        const regCenter = region === "toshkent" ? [41.3111, 69.2797] : [40.1225, 67.8425];
        facilityObj = {
          id: "stf-fac-" + Date.now(),
          region,
          type: field,
          status: "open",
          name: `${fullName} — ${districtAddress}`,
          address: districtAddress,
          lat: regCenter[0],
          lng: regCenter[1],
          fuels: field === "ayoqsh" ? [deptId] : undefined
        };
        FACILITIES.unshift(facilityObj);
      }

      const specId = makeStaffSlugId(`${fullName}-${room}`);
      const qKey = `${facilityObj.id}__${deptObj.id}__${specId}`;

      const newAcc = {
        loginKey,
        password,
        fullName,
        field,
        region,
        districtAddress: districtAddress || facilityObj.address,
        facilityId: facilityObj.id,
        facilityName: facilityObj.name,
        deptId: deptObj.id,
        deptName: deptObj.name,
        specId,
        room,
        qKey
      };

      STAFF_ACCOUNTS[loginKey] = newAcc;
      activeStaff = newAcc;
      saveLocalAccounts();
      localStorage.setItem(STAFF_SESSION_KEY, JSON.stringify(activeStaff));
      await pushStateToFirebase();
      openWorkstationUI();
      showToast("✅ Xodim akkounti yaratildi va xaritaga ulandi!");
    }

    function openWorkstationUI() {
      document.getElementById("staffAuthSection").classList.add("hidden");
      document.getElementById("staffWorkSection").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");
      document.getElementById("headerStaffSub").textContent = `${activeStaff.fullName} • ${activeStaff.room}`;
      document.getElementById("workFacilityName").textContent = activeStaff.facilityName;
      document.getElementById("workStaffName").textContent = activeStaff.fullName;
      document.getElementById("workMeta").textContent = `${(activeStaff.field || "").toUpperCase()} • ${activeStaff.deptName} • ${activeStaff.room}`;
      renderWorkstation();
    }

    function logoutStaff() {
      localStorage.removeItem(STAFF_SESSION_KEY);
      activeStaff = null;
      document.getElementById("staffWorkSection").classList.add("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
      document.getElementById("staffAuthSection").classList.remove("hidden");
      document.getElementById("headerStaffSub").textContent = "Xodimlar profili va navbat boshqaruvi";
    }

    function renderWorkstation() {
      if (!activeStaff) return;
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      document.getElementById("workQueueCount").textContent = q.length;

      const curBox = document.getElementById("currentServingBox");
      if (!q.length) {
        curBox.innerHTML = `<div class="text-center py-4"><div class="text-2xl mb-1">☕</div><div class="text-sm font-bold text-white">Hozir navbat bo‘sh</div></div>`;
      } else {
        const cur = q[0];
        curBox.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="px-2.5 py-1 rounded-full bg-[#22C55E]/15 text-[#22C55E] text-[10px] font-extrabold uppercase">🟢 Hozirgi mijoz</span>
            <span class="text-xs text-[#8E8E93]">${cur.createdAt || ''}</span>
          </div>
          <div>
            <div class="text-3xl font-extrabold text-[#E2C2FF]">№ ${cur.ticketNumber}</div>
            <div class="text-base font-bold text-white mt-0.5">${cur.fullName}</div>
            <div class="text-xs text-[#8E8E93]">${cur.serviceLabel} • ${cur.userPhone || 'Joyida'}</div>
          </div>
          <div class="grid grid-cols-2 gap-2.5 pt-2">
            <button onclick="completeCurrentPatient()" class="py-3 rounded-2xl bg-[#22C55E] text-[#111114] font-extrabold text-xs cursor-pointer">
              ✅ Qabul yakunlandi
            </button>
            <button onclick="skipCurrentPatient()" class="py-3 rounded-2xl bg-[#F59E0B]/20 border border-[#F59E0B]/40 text-[#F59E0B] font-bold text-xs cursor-pointer">
              ⏭ Kelmadi (Surish)
            </button>
          </div>`;
      }

      const listBox = document.getElementById("waitingQueueList");
      const waiting = q.slice(1);
      listBox.innerHTML = !waiting.length
        ? `<div class="oled-card p-4 text-center text-xs text-[#8E8E93]">Keyingi kutayotganlar yo‘q</div>`
        : waiting.map(item => `
          <div class="oled-card-2 p-3.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-xs font-bold text-white truncate">№${item.ticketNumber} • ${item.fullName}</div>
              <div class="text-[11px] text-[#8E8E93] truncate">${item.serviceLabel} • ~${item.durationMin || 8} daq</div>
            </div>
            <button onclick="removeTicketById('${item.id}')" class="px-2.5 py-1.5 rounded-xl bg-black text-[#F87171] text-[11px] font-bold cursor-pointer">
              O‘chirish
            </button>
          </div>`).join("");
    }

    async function completeCurrentPatient() {
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      if (!q.length) return;
      const done = q.shift();
      await pushStateToFirebase();
      renderWorkstation();
      showToast(`✅ №${done.ticketNumber} yakunlandi`);
    }

    async function skipCurrentPatient() {
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      if (q.length <= 1) return showToast("Navbatda boshqa mijoz yo‘q", true);
      const first = q.shift();
      q.splice(Math.min(2, q.length), 0, first);
      await pushStateToFirebase();
      renderWorkstation();
      showToast(`⏭ №${first.ticketNumber} orqaga surildi`);
    }

    async function removeTicketById(id) {
      GLOBAL_QUEUES[activeStaff.qKey] = (GLOBAL_QUEUES[activeStaff.qKey] || []).filter(x => x.id !== id);
      await pushStateToFirebase();
      renderWorkstation();
      showToast("Navbatdan o‘chirildi");
    }

    async function addWalkInPatient() {
      const inp = document.getElementById("walkInName");
      const name = inp.value.trim() || "Jonli navbat mijozi";
      if (!GLOBAL_QUEUES[activeStaff.qKey]) GLOBAL_QUEUES[activeStaff.qKey] = [];
      const q = GLOBAL_QUEUES[activeStaff.qKey];
      const maxNum = q.reduce((m, x) => Math.max(m, x.ticketNumber || 0), 0);
      q.push({
        id: "wk-" + Date.now(),
        ticketNumber: maxNum + 1,
        userPhone: "Joyida",
        fullName: name,
        facilityId: activeStaff.facilityId,
        facilityName: activeStaff.facilityName,
        deptId: activeStaff.deptId,
        deptName: activeStaff.deptName,
        specId: activeStaff.specId,
        specialistName: activeStaff.fullName,
        room: activeStaff.room,
        serviceLabel: "Joyida qabul",
        durationMin: 8,
        createdAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      inp.value = "";
      await pushStateToFirebase();
      renderWorkstation();
      showToast(`➕ №${maxNum + 1} qo‘shildi`);
    }

    window.onload = async function () {
      loadLocalAccounts();
      document.getElementById("regRegion").innerHTML = Object.entries(REGIONS)
        .map(([k, v]) => `<option value="${k}" class="bg-[#1C1C1E]">${v}</option>`).join("");
      onRegFieldChange();

      await pullFromFirebase(false);
      const saved = localStorage.getItem(STAFF_SESSION_KEY);
      if (saved) {
        try {
          activeStaff = JSON.parse(saved);
          openWorkstationUI();
        } catch {}
      }
      setInterval(() => pullFromFirebase(false), 3500);
    };
  </script>
</body>
</html>
