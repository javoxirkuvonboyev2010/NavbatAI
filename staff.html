<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NavbatAI Staff — Xodim va Navbat Boshqaruvi</title>
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    }
    .oled-card {
      background-color: #151517;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
    }
    .oled-card-2 {
      background-color: #1C1C1E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
    }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen">

  <div class="max-w-[480px] mx-auto min-h-screen bg-black flex flex-col sm:border-x sm:border-white/[0.06]">

    <!-- Toast -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[3000] max-w-[430px] w-[92%] pointer-events-none opacity-0 -translate-y-2 transition-all duration-200">
      <div class="bg-[#1C1C1E] border border-white/15 text-white px-4 py-3 rounded-2xl text-xs font-semibold flex items-center gap-2.5 shadow-xl">
        <span id="toastDot" class="w-2.5 h-2.5 rounded-full bg-[#22C55E] shrink-0"></span>
        <span id="toastText"></span>
      </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-black/95 border-b border-white/[0.08] px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-[#E2C2FF]/15 border border-[#E2C2FF]/35 flex items-center justify-center shrink-0 overflow-hidden">
          <img src="./logo.png" alt="NavbatAI Staff" class="w-full h-full object-cover" />
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-extrabold text-white leading-none">NavbatAI Staff</h1>
            <span class="px-1.5 py-0.5 rounded-full text-[9px] font-extrabold bg-[#E2C2FF]/20 text-[#E2C2FF] border border-[#E2C2FF]/30">XODIM</span>
          </div>
          <p id="headerSub" class="text-[11px] text-[#8E8E93] truncate mt-0.5">Muassasa va xodim kabineti</p>
        </div>
      </div>

      <button id="logoutBtn" type="button" onclick="logoutStaff()"
        class="hidden px-3 py-1.5 rounded-xl bg-[#1C1C1E] hover:bg-[#27272A] border border-white/10 text-xs font-bold text-[#F87171] cursor-pointer shrink-0">
        Chiqish
      </button>
    </header>

    <!-- ================= 1. STAFF LOGIN / REGISTER SCREEN ================= -->
    <main id="staffAuthView" class="flex-1 px-4 py-5 space-y-4">
      <div class="oled-card p-4 flex items-center gap-3.5">
        <div class="w-14 h-14 rounded-2xl bg-[#E2C2FF]/15 border border-[#E2C2FF]/35 flex items-center justify-center shrink-0 overflow-hidden">
          <img src="./logo.png" alt="NavbatAI Staff Logo" class="w-full h-full object-cover" />
        </div>
        <div class="min-w-0">
          <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#E2C2FF]">NavbatAI Staff Panel</div>
          <h2 class="text-base font-extrabold text-white mt-0.5">Xodim ish stoli</h2>
          <p class="text-[11px] text-[#8E8E93] mt-0.5">Mijozlar navbatini qabul qilish va jonli navbat qo‘shish</p>
        </div>
      </div>

      <div class="oled-card p-5 space-y-4">
        <div class="grid grid-cols-2 gap-1.5 bg-black p-1 rounded-2xl border border-white/[0.08]">
          <button type="button" id="tabStaffLogin" onclick="setStaffAuthMode('login')"
            class="py-2.5 rounded-xl text-xs font-bold bg-[#E2C2FF] text-[#111114] cursor-pointer">
            Kirish
          </button>
          <button type="button" id="tabStaffRegister" onclick="setStaffAuthMode('register')"
            class="py-2.5 rounded-xl text-xs font-bold text-[#8E8E93] hover:text-white cursor-pointer">
            Ro‘yxatdan o‘tish
          </button>
        </div>

        <div id="staffRegFields" class="hidden space-y-3">
          <div>
            <label class="block text-[11px] text-[#8E8E93] mb-1">Viloyat *</label>
            <select id="stRegion" onchange="populateStaffFacilities()"
              class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3 py-2.5 text-xs text-white"></select>
          </div>

          <div>
            <label class="block text-[11px] text-[#8E8E93] mb-1">Muassasa *</label>
            <select id="stFacility" onchange="populateStaffDepartments()"
              class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3 py-2.5 text-xs text-white"></select>
          </div>

          <div>
            <label class="block text-[11px] text-[#8E8E93] mb-1">Bo‘lim *</label>
            <select id="stDept"
              class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3 py-2.5 text-xs text-white"></select>
          </div>

          <div>
            <label class="block text-[11px] text-[#8E8E93] mb-1">Xodim / Shifokor / Operator F.I.Sh *</label>
            <input id="stFullName" type="text" placeholder="Masalan: Dr. Azizbek Karimov"
              class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-[#8E8E93]" />
          </div>

          <div>
            <label class="block text-[11px] text-[#8E8E93] mb-1">Xona / Oyna / Yo‘lak *</label>
            <input id="stRoom" type="text" placeholder="Masalan: 12-xona"
              class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-[#8E8E93]" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-[#8E8E93] mb-1">Xodim login (telefon yoki login) *</label>
          <input id="stLogin" type="text" placeholder="+998901234567 yoki doktor1"
            class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-[#8E8E93]" />
        </div>

        <div>
          <label class="block text-[11px] text-[#8E8E93] mb-1">Parol *</label>
          <input id="stPassword" type="password" placeholder="Kamida 6 ta belgi"
            class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-[#8E8E93]" />
        </div>

        <div id="stAuthError" class="hidden text-xs text-[#F87171] bg-[#F87171]/10 border border-[#F87171]/30 rounded-xl px-3 py-2"></div>

        <button id="stAuthSubmitBtn" type="button" onclick="submitStaffAuth()"
          class="w-full py-3 rounded-2xl bg-[#E2C2FF] hover:bg-[#D8B4FE] text-[#111114] font-extrabold text-xs cursor-pointer">
          Ish stoliga kirish
        </button>
      </div>
    </main>

    <!-- ================= 2. STAFF WORKSTATION ================= -->
    <main id="staffWorkView" class="hidden flex-1 px-4 py-4 space-y-4 pb-10">

      <!-- Active Staff Card -->
      <div class="oled-card p-4 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div id="workFacilityName" class="text-[11px] font-bold text-[#E2C2FF] truncate">Muassasa</div>
          <div id="workStaffName" class="text-base font-extrabold text-white truncate mt-0.5">Xodim</div>
          <div id="workMeta" class="text-xs text-[#8E8E93] truncate mt-0.5">Bo‘lim • Xona</div>
        </div>
        <div class="text-right shrink-0 bg-[#1C1C1E] border border-white/10 rounded-2xl px-3 py-2">
          <div class="text-[10px] text-[#8E8E93]">Navbatda</div>
          <div id="workQueueCount" class="text-xl font-extrabold text-[#22C55E]">0</div>
        </div>
      </div>

      <!-- Current Serving Patient -->
      <div class="oled-card p-4 space-y-3" id="currentServingBox"></div>

      <!-- Add Walk-in Patient (Mandatory Name + Phone) -->
      <div class="oled-card p-4 space-y-3">
        <div class="text-xs font-extrabold text-white">➕ Jonli navbatga mijoz qo‘shish (majburiy)</div>
        <div>
          <input id="walkInName" type="text" placeholder="Ism va familiya *"
            class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-[#8E8E93] focus:outline-none focus:border-[#E2C2FF]" />
        </div>
        <div>
          <input id="walkInPhone" type="tel" value="+998 " placeholder="+998 90 123 45 67"
            oninput="ensureWalkInPhonePrefix(this)" onkeydown="guardWalkInPhonePrefix(event, this)"
            class="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-[#8E8E93] focus:outline-none focus:border-[#E2C2FF]" />
        </div>
        <button id="walkInSubmitBtn" type="button" onclick="addWalkInPatient()"
          class="w-full py-3 rounded-xl bg-[#22C55E] hover:bg-[#16A34A] text-[#111114] font-extrabold text-xs cursor-pointer">
          + Navbatga qo‘shish
        </button>
      </div>

      <!-- Waiting Queue List -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h3 class="text-xs font-extrabold uppercase tracking-wider text-[#8E8E93]">Kutayotganlar ro‘yxati</h3>
          <button type="button" onclick="pullStateFromFirebase(true)" class="text-xs font-bold text-[#E2C2FF] cursor-pointer">↻ Yangilash</button>
        </div>
        <div id="waitingQueueList" class="space-y-2"></div>
      </div>

      <!-- Completed Patients History -->
      <div class="space-y-2.5 pt-1">
        <div class="flex items-center justify-between px-1">
          <h3 class="text-xs font-extrabold uppercase tracking-wider text-[#8E8E93]">
            📜 Kelgan mijozlar tarixi (<span id="staffHistoryCount">0</span>)
          </h3>
          <button type="button" onclick="clearStaffHistory()" class="text-[11px] font-bold text-[#F87171] cursor-pointer">
            Tozalash
          </button>
        </div>
        <div id="staffHistoryList" class="space-y-2"></div>
      </div>

    </main>
  </div>

  <script>
    const FB_URL = "https://navbatai-3im-default-rtdb.europe-west1.firebasedatabase.app";
    const FACILITIES_KEY = "navbat_ai_facilities_v8";
    const QUEUES_KEY     = "navbat_ai_global_queues_v8";
    const STAFF_DB_KEY   = "navbat_ai_staff_accounts_v1";
    const STAFF_SES_KEY  = "navbat_ai_staff_session_v1";

    const REGIONS = {
      jizzax:          { name: "Jizzax",          center: [40.1225, 67.8425] },
      toshkent:        { name: "Toshkent",        center: [41.3111, 69.2797] },
      samarqand:       { name: "Samarqand",       center: [39.6542, 66.9597] },
      buxoro:          { name: "Buxoro",          center: [39.7747, 64.4286] },
      andijon:         { name: "Andijon",         center: [40.7821, 72.3442] },
      fargona:         { name: "Farg‘ona",        center: [40.3842, 71.7843] },
      namangan:        { name: "Namangan",        center: [40.9983, 71.6726] },
      qashqadaryo:     { name: "Qashqadaryo",     center: [38.8606, 65.7891] },
      surxondaryo:     { name: "Surxondaryo",     center: [37.2242, 67.2783] },
      navoiy:          { name: "Navoiy",          center: [40.0844, 65.3792] },
      sirdaryo:        { name: "Sirdaryo",        center: [40.4897, 68.7842] },
      xorazm:          { name: "Xorazm",          center: [41.5500, 60.6333] },
      qoraqalpogiston: { name: "Qoraqalpog‘iston", center: [42.4531, 59.6103] }
    };

    const DEFAULT_FACILITIES = [
      { id: "adm-1795280787637", region: "jizzax", type: "shifoxona", status: "open", name: "Ziyo Nur Med Shifo", address: "Baynalminalchilar ko'chasi" },
      { id: "adm-1795279615427", region: "jizzax", type: "bank", status: "open", name: "Anorbank Jizzax viloyati", address: "Sug'diyona ro'parasida" },
      { id: "jiz-9", region: "jizzax", type: "shifoxona", status: "open", name: "Jizzax shahar 3-sonli oilaviy poliklinikasi", address: "Ittifoq MFY, Jizzax" },
      { id: "jiz-1", region: "jizzax", type: "shifoxona", status: "open", name: "Jizzax viloyat ko‘p tarmoqli tibbiyot markazi", address: "Sh. Rashidov shoh ko‘chasi, Jizzax" },
      { id: "jiz-11", region: "jizzax", type: "dxm", status: "open", name: "Jizzax shahar Davlat xizmatlari markazi (DXM)", address: "I. Karimov ko‘chasi 12, Jizzax" },
      { id: "jiz-13", region: "jizzax", type: "bank", status: "open", name: "Agrobank Jizzax filiali", address: "Sh. Rashidov ko‘chasi 42, Jizzax" }
    ];

    const DEPTS_BY_TYPE = {
      shifoxona: [
        { id: "terapevt", name: "Terapevt" },
        { id: "stomatolog", name: "Stomatolog (Tish)" },
        { id: "ginekolog", name: "Ginekolog" },
        { id: "oftalmolog", name: "Oftalmolog (Ko‘z)" },
        { id: "kardiolog", name: "Kardiolog (Yurak)" },
        { id: "pediatr", name: "Pediatr (Bolalar)" },
        { id: "lor", name: "LOR (Quloq-tomoq-burun)" }
      ],
      bank: [
        { id: "karta", name: "Karta ochish va omonatlar" },
        { id: "kredit", name: "Kredit bo‘limi" }
      ],
      dxm: [
        { id: "id_pasport", name: "ID-karta / Pasport" },
        { id: "kadastr", name: "Kadastr va ko‘chmas mulk" }
      ],
      ayoqsh: [
        { id: "metan", name: "🔥 Metan" },
        { id: "propan", name: "💨 Propan" },
        { id: "benzin", name: "⛽ Benzin" },
        { id: "dizel", name: "🛢 Dizel" },
        { id: "elektr", name: "⚡ Elektr" }
      ]
    };

    let FACILITIES = [];
    let GLOBAL_QUEUES = {};
    let STAFF_ACCOUNTS = {};
    let staffAuthMode = "login";
    let activeStaff = null;
    let pollTimer = null;
    let isAddingWalkIn = false;

    function safeGet(k, fb) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; }
    }
    function safeSet(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
    }

    let toastTimer = null;
    function showToast(msg, isWarn = false) {
      const el = document.getElementById("toast");
      document.getElementById("toastText").textContent = msg;
      document.getElementById("toastDot").className = `w-2.5 h-2.5 rounded-full shrink-0 ${isWarn ? 'bg-[#F59E0B]' : 'bg-[#22C55E]'}`;
      el.classList.remove("opacity-0", "-translate-y-2");
      el.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add("opacity-0", "-translate-y-2");
        el.classList.remove("opacity-100", "translate-y-0");
      }, 3200);
    }

    function showAuthError(msg) {
      const el = document.getElementById("stAuthError");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function setStaffAuthMode(mode) {
      staffAuthMode = mode;
      const isReg = mode === "register";
      document.getElementById("staffRegFields").classList.toggle("hidden", !isReg);
      document.getElementById("tabStaffLogin").className = !isReg
        ? "py-2.5 rounded-xl text-xs font-bold bg-[#E2C2FF] text-[#111114] cursor-pointer"
        : "py-2.5 rounded-xl text-xs font-bold text-[#8E8E93] hover:text-white cursor-pointer";
      document.getElementById("tabStaffRegister").className = isReg
        ? "py-2.5 rounded-xl text-xs font-bold bg-[#E2C2FF] text-[#111114] cursor-pointer"
        : "py-2.5 rounded-xl text-xs font-bold text-[#8E8E93] hover:text-white cursor-pointer";
      document.getElementById("stAuthSubmitBtn").textContent = isReg ? "Ro‘yxatdan o‘tish va kirish" : "Ish stoliga kirish";
      document.getElementById("stAuthError").classList.add("hidden");
    }

    function populateRegionSelect() {
      const sel = document.getElementById("stRegion");
      sel.innerHTML = Object.entries(REGIONS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
      sel.value = "jizzax";
      populateStaffFacilities();
    }

    function populateStaffFacilities() {
      const regKey = document.getElementById("stRegion").value;
      const list = FACILITIES.filter(f => (f.region || "jizzax").toLowerCase() === regKey);
      const sel = document.getElementById("stFacility");
      if (!list.length) {
        sel.innerHTML = `<option value="">Bu hududda muassasa topilmadi</option>`;
        document.getElementById("stDept").innerHTML = `<option value="">Bo‘lim yo‘q</option>`;
        return;
      }
      sel.innerHTML = list.map(f => `<option value="${f.id}">${f.name} (${f.type})</option>`).join("");
      populateStaffDepartments();
    }

    function populateStaffDepartments() {
      const facId = document.getElementById("stFacility").value;
      const fac = FACILITIES.find(f => f.id === facId);
      const depts = DEPTS_BY_TYPE[fac?.type || "shifoxona"] || DEPTS_BY_TYPE.shifoxona;
      document.getElementById("stDept").innerHTML = depts.map(d => `<option value="${d.id}">${d.name}</option>`).join("");
    }

    async function pullStateFromFirebase(notify = false) {
      try {
        const res = await fetch(`${FB_URL}/navbatai_state.json`);
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();
        if (data) {
          if (Array.isArray(data.facilities) && data.facilities.length) {
            const ids = new Set(data.facilities.map(x => x.id));
            FACILITIES = [...data.facilities, ...DEFAULT_FACILITIES.filter(d => !ids.has(d.id))];
            safeSet(FACILITIES_KEY, FACILITIES);
          }
          GLOBAL_QUEUES = data.queues || {};
          STAFF_ACCOUNTS = data.staffAccounts || {};
          safeSet(QUEUES_KEY, GLOBAL_QUEUES);
          safeSet(STAFF_DB_KEY, STAFF_ACCOUNTS);
          if (activeStaff) renderWorkstation();
          if (notify) showToast("Ma’lumotlar yangilandi");
        }
      } catch {
        if (notify) showToast("Bazadan yangilashda xatolik", true);
      }
    }

    async function pushStateToFirebase() {
      safeSet(QUEUES_KEY, GLOBAL_QUEUES);
      safeSet(STAFF_DB_KEY, STAFF_ACCOUNTS);
      const res = await fetch(`${FB_URL}/navbatai_state.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          facilities: FACILITIES,
          queues: GLOBAL_QUEUES,
          staffAccounts: STAFF_ACCOUNTS
        })
      });
      if (!res.ok) {
        throw new Error("Firebase PUT failed: " + res.status);
      }
    }

    function makeLoginKey(raw) {
      return (raw || "").trim().toLowerCase().replace(/[^a-z0-9_+.-]/g, "_");
    }

    async function submitStaffAuth() {
      document.getElementById("stAuthError").classList.add("hidden");
      await pullStateFromFirebase(false);

      const rawLogin = document.getElementById("stLogin").value.trim();
      const password = document.getElementById("stPassword").value.trim();
      const loginKey = makeLoginKey(rawLogin);

      if (!loginKey || loginKey.length < 3) return showAuthError("Login yoki telefon raqamni kiriting!");
      if (!password || password.length < 6) return showAuthError("Parol kamida 6 ta belgidan iborat bo‘lsin!");

      if (staffAuthMode === "register") {
        if (STAFF_ACCOUNTS[loginKey]) return showAuthError("Bu login allaqachon ro‘yxatdan o‘tgan!");
        const regionKey = document.getElementById("stRegion").value;
        const facilityId = document.getElementById("stFacility").value;
        const deptId = document.getElementById("stDept").value;
        const fullName = document.getElementById("stFullName").value.trim();
        const room = document.getElementById("stRoom").value.trim() || "1-xona";

        const fac = FACILITIES.find(f => f.id === facilityId);
        if (!fac) return showAuthError("Muassasani tanlang!");
        if (!fullName || fullName.length < 3) return showAuthError("Xodim ism-familiyasini kiriting!");

        const depts = DEPTS_BY_TYPE[fac.type || "shifoxona"] || DEPTS_BY_TYPE.shifoxona;
        const deptObj = depts.find(d => d.id === deptId) || depts[0];
        const specId = `staff-${loginKey}`;

        const account = {
          loginKey,
          loginDisplay: rawLogin,
          password,
          regionKey,
          regionName: REGIONS[regionKey]?.name || regionKey,
          facilityId: fac.id,
          facilityName: fac.name,
          deptId: deptObj.id,
          deptName: deptObj.name,
          specId,
          fullName,
          room,
          qKey: `${fac.id}__${deptObj.id}__${specId}`
        };

        STAFF_ACCOUNTS[loginKey] = account;
        await pushStateToFirebase();
        activeStaff = account;
        safeSet(STAFF_SES_KEY, loginKey);
        enterWorkstation();
        showToast(`Xush kelibsiz, ${fullName}!`);
        return;
      }

      const acc = STAFF_ACCOUNTS[loginKey];
      if (!acc) return showAuthError("Bunday xodim logini topilmadi. Avval ro‘yxatdan o‘ting.");
      if (acc.password !== password) return showAuthError("Parol noto‘g‘ri!");

      activeStaff = acc;
      safeSet(STAFF_SES_KEY, loginKey);
      enterWorkstation();
      showToast(`Xush kelibsiz, ${acc.fullName}!`);
    }

    function logoutStaff() {
      activeStaff = null;
      try { localStorage.removeItem(STAFF_SES_KEY); } catch {}
      document.getElementById("staffWorkView").classList.add("hidden");
      document.getElementById("staffAuthView").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
      document.getElementById("headerSub").textContent = "Muassasa va xodim kabineti";
      populateStaffFacilities();
    }

    function enterWorkstation() {
      document.getElementById("staffAuthView").classList.add("hidden");
      document.getElementById("staffWorkView").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");
      document.getElementById("headerSub").textContent = `${activeStaff.facilityName} • ${activeStaff.room}`;
      document.getElementById("workFacilityName").textContent = activeStaff.facilityName;
      document.getElementById("workStaffName").textContent = activeStaff.fullName;
      document.getElementById("workMeta").textContent = `${activeStaff.regionName} • ${activeStaff.deptName} • ${activeStaff.room}`;
      const phoneInp = document.getElementById("walkInPhone");
      if (phoneInp && !phoneInp.value.trim()) phoneInp.value = "+998 ";
      renderWorkstation();
    }

    function getStaffHistoryKey() {
      return "navbat_staff_history_" + (activeStaff?.qKey || "default");
    }

    function loadStaffHistory() {
      if (!activeStaff) return [];
      try {
        const raw = JSON.parse(localStorage.getItem(getStaffHistoryKey()) || "[]");
        return Array.isArray(raw) ? raw : [];
      } catch {
        return [];
      }
    }

    function saveStaffHistory(arr) {
      if (!activeStaff) return;
      try {
        localStorage.setItem(getStaffHistoryKey(), JSON.stringify(arr.slice(0, 100)));
      } catch {}
    }

    function pushToStaffHistory(item, statusLabel = "Qabul qilindi") {
      if (!activeStaff || !item) return;
      const hist = loadStaffHistory();
      hist.unshift({
        id: item.id || ("h-" + Date.now()),
        ticketNumber: Number(item.ticketNumber) || 1,
        fullName: item.fullName,
        phone: item.userPhone || "Kiritilmagan",
        serviceLabel: item.serviceLabel || "Xizmat",
        statusLabel,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      saveStaffHistory(hist);
    }

    function clearStaffHistory() {
      if (!activeStaff) return;
      saveStaffHistory([]);
      renderStaffHistory();
      showToast("Tarix tozalandi");
    }

    function renderStaffHistory() {
      const countEl = document.getElementById("staffHistoryCount");
      const listEl = document.getElementById("staffHistoryList");
      if (!countEl || !listEl) return;

      const hist = loadStaffHistory();
      countEl.textContent = String(hist.length);

      if (!hist.length) {
        listEl.innerHTML = `<div class="oled-card p-3.5 text-center text-xs text-[#8E8E93]">Hali tarixda mijozlar yo‘q</div>`;
        return;
      }

      listEl.innerHTML = hist.map(h => `
        <div class="oled-card-2 p-3 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-xs font-bold text-white truncate">№${h.ticketNumber} • ${h.fullName}</div>
            <div class="text-[11px] text-[#8E8E93] truncate">📞 ${h.phone} • ${h.serviceLabel}</div>
          </div>
          <div class="text-right shrink-0">
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#22C55E]/15 text-[#22C55E]">${h.statusLabel}</span>
            <div class="text-[10px] text-[#8E8E93] mt-0.5">${h.time}</div>
          </div>
        </div>
      `).join("");
    }

    function getNextSequentialTicketNumber(q) {
      const activeMax = Array.isArray(q)
        ? q.reduce((m, x) => Math.max(m, Number(x.ticketNumber) || 0), 0)
        : 0;
      const hist = loadStaffHistory();
      const historyMax = Array.isArray(hist)
        ? hist.reduce((m, h) => Math.max(m, Number(h.ticketNumber) || 0), 0)
        : 0;
      return Math.max(activeMax, historyMax) + 1;
    }

    function ensureWalkInPhonePrefix(inp) {
      if (!inp) return;
      let val = inp.value || "";
      if (!val.startsWith("+998")) {
        const digits = val.replace(/[^0-9]/g, "").replace(/^998/, "");
        inp.value = "+998 " + digits;
      }
    }

    function guardWalkInPhonePrefix(e, inp) {
      if (!inp) return;
      const start = inp.selectionStart ?? 0;
      const end = inp.selectionEnd ?? 0;
      if ((e.key === "Backspace" && start <= 5 && end <= 5) || (e.key === "Delete" && start < 5)) {
        e.preventDefault();
        ensureWalkInPhonePrefix(inp);
      }
    }

    function renderWorkstation() {
      if (!activeStaff) return;
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      document.getElementById("workQueueCount").textContent = q.length;

      const curBox = document.getElementById("currentServingBox");
      if (!q.length) {
        curBox.innerHTML = `<div class="text-center py-4"><div class="text-2xl mb-1">☕</div><div class="text-sm font-bold text-white">Hozir navbat bo‘sh</div></div>`;
      } else {
        const cur = q[0];
        curBox.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="px-2.5 py-1 rounded-full bg-[#22C55E]/15 text-[#22C55E] text-[10px] font-extrabold uppercase">🟢 Hozirgi mijoz</span>
            <span class="text-xs text-[#8E8E93]">${cur.createdAt || ''}</span>
          </div>
          <div>
            <div class="text-3xl font-extrabold text-[#E2C2FF]">№ ${cur.ticketNumber}</div>
            <div class="text-base font-bold text-white mt-0.5">${cur.fullName}</div>
            <div class="text-xs text-[#8E8E93]">${cur.serviceLabel} • ${cur.userPhone || 'Joyida'}</div>
          </div>
          <div class="grid grid-cols-2 gap-2.5 pt-2">
            <button type="button" onclick="completeCurrentPatient()" class="py-3 rounded-2xl bg-[#22C55E] text-[#111114] font-extrabold text-xs cursor-pointer">
              ✅ Qabul yakunlandi
            </button>
            <button type="button" onclick="skipCurrentPatient()" class="py-3 rounded-2xl bg-[#F59E0B]/20 border border-[#F59E0B]/40 text-[#F59E0B] font-bold text-xs cursor-pointer">
              ⏭ Kelmadi (Surish)
            </button>
          </div>`;
      }

      const listBox = document.getElementById("waitingQueueList");
      const waiting = q.slice(1);
      listBox.innerHTML = !waiting.length
        ? `<div class="oled-card p-4 text-center text-xs text-[#8E8E93]">Keyingi kutayotganlar yo‘q</div>`
        : waiting.map(item => `
          <div class="oled-card-2 p-3.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-xs font-bold text-white truncate">№${item.ticketNumber} • ${item.fullName}</div>
              <div class="text-[11px] text-[#8E8E93] truncate">${item.serviceLabel} • ~${item.durationMin || 8} daq</div>
            </div>
            <button type="button" onclick="removeTicketById('${item.id}')" class="px-2.5 py-1.5 rounded-xl bg-black text-[#F87171] text-[11px] font-bold cursor-pointer">
              O‘chirish
            </button>
          </div>`).join("");

      renderStaffHistory();
    }

    async function completeCurrentPatient() {
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      if (!q.length) return;
      const done = q.shift();
      pushToStaffHistory(done, "Qabul qilindi");
      await pushStateToFirebase();
      renderWorkstation();
      showToast(`✅ №${done.ticketNumber} yakunlandi va tarixga saqlandi`);
    }

    async function skipCurrentPatient() {
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      if (q.length <= 1) return showToast("Navbatda boshqa mijoz yo‘q", true);
      const first = q.shift();
      q.splice(Math.min(2, q.length), 0, first);
      await pushStateToFirebase();
      renderWorkstation();
      showToast(`⏭ №${first.ticketNumber} orqaga surildi`);
    }

    async function removeTicketById(id) {
      const q = GLOBAL_QUEUES[activeStaff.qKey] || [];
      const idx = q.findIndex(x => x.id === id);
      if (idx === -1) return;
      q.splice(idx, 1);
      await pushStateToFirebase();
      renderWorkstation();
      showToast("Navbat o‘chirildi");
    }

    async function addWalkInPatient() {
      if (isAddingWalkIn || !activeStaff) return;

      const nameInp = document.getElementById("walkInName");
      const phoneInp = document.getElementById("walkInPhone");
      const submitBtn = document.getElementById("walkInSubmitBtn");

      const fullName = (nameInp?.value || "").trim();
      const rawPhone = (phoneInp?.value || "").trim();
      const digitsOnly = rawPhone.replace(/[^0-9]/g, "");
      const subscriberDigits = digitsOnly.startsWith("998") ? digitsOnly.slice(3) : digitsOnly;

      if (fullName.length < 2) {
        nameInp?.focus();
        return showToast("❌ Xato: Ism va familiyani kamida 2 ta harf bilan kiriting!", true);
      }
      if (subscriberDigits.length < 9) {
        phoneInp?.focus();
        return showToast(`❌ Xato: Telefon raqamini to‘liq kiriting (+998 dan keyin 9 ta raqam; hozir ${subscriberDigits.length} ta)!`, true);
      }

      isAddingWalkIn = true;
      const origHtml = submitBtn ? submitBtn.innerHTML : "+ Navbatga qo‘shish";
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "⏳ Qo‘shilmoqda...";
      }

      try {
        if (!GLOBAL_QUEUES[activeStaff.qKey]) GLOBAL_QUEUES[activeStaff.qKey] = [];
        const q = GLOBAL_QUEUES[activeStaff.qKey];
        const nextTicketNum = getNextSequentialTicketNumber(q);
        const formattedPhone = "+998" + subscriberDigits;

        const newTicket = {
          id: "wk-" + Date.now(),
          ticketNumber: nextTicketNum,
          userPhone: formattedPhone,
          fullName,
          facilityId: activeStaff.facilityId,
          facilityName: activeStaff.facilityName,
          deptId: activeStaff.deptId,
          deptName: activeStaff.deptName,
          specId: activeStaff.specId,
          specialistName: activeStaff.fullName,
          room: activeStaff.room,
          serviceLabel: "Joyida qabul",
          durationMin: 8,
          createdAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        };

        q.push(newTicket);
        await pushStateToFirebase();

        if (nameInp) nameInp.value = "";
        if (phoneInp) phoneInp.value = "+998 ";

        renderWorkstation();
        showToast(`✅ №${nextTicketNum} (${fullName}) navbatga qo‘shildi`);
      } catch {
        showToast("❌ Xato: Bazaga yozishda xatolik yuz berdi. Kiritilgan ma’lumot o‘chmadi, qayta urining!", true);
      } finally {
        isAddingWalkIn = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origHtml;
        }
      }
    }

    window.onload = async function () {
      const savedFac = safeGet(FACILITIES_KEY, null);
      FACILITIES = Array.isArray(savedFac) && savedFac.length ? savedFac : [...DEFAULT_FACILITIES];
      GLOBAL_QUEUES = safeGet(QUEUES_KEY, {});
      STAFF_ACCOUNTS = safeGet(STAFF_DB_KEY, {});

      populateRegionSelect();
      await pullStateFromFirebase(false);
      populateStaffFacilities();

      let sesKey = null;
      try { sesKey = localStorage.getItem(STAFF_SES_KEY); } catch {}
      if (sesKey && STAFF_ACCOUNTS[sesKey]) {
        activeStaff = STAFF_ACCOUNTS[sesKey];
        enterWorkstation();
      }

      pollTimer = setInterval(() => {
        if (activeStaff && !isAddingWalkIn) pullStateFromFirebase(false);
      }, 6000);
    };
  </script>
</body>
</html>
